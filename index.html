  <style>
    @font-face {
      font-family: "Berkeley Mono";
      src: url("/fonts/BerkeleyMono-Regular.woff2") format("woff2");
      font-display: swap;
    }

    :root {
      color-scheme: dark;
      --blue: #075cff;
      --night: #020713;
      --gold: #caae65;
      --bone: #eadfc3;
      --wood: #49351f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07122f;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    #painting-view,
    #gallery {
      position: fixed;
      inset: 0;
    }

    #painting-view {
      z-index: 1;
      display: grid;
      place-items: center;
      background: #07122f;
      transition:
        opacity 850ms ease,
        transform 1450ms cubic-bezier(.15, .8, .2, 1),
        filter 1100ms ease;
    }

    .painting-stage {
      position: relative;
      width: min(100vw, calc(100vh * 600 / 534));
      height: min(100vh, calc(100vw * 534 / 600));
    }

    .painting-stage > img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .anatomical-door {
      position: absolute;
      left: 82%;
      top: 59.2%;
      width: clamp(20px, 4.5%, 32px);
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 50%;
      color: transparent;
      background: transparent;
      cursor: pointer;
      transform: translate(-50%, -50%);
    }

    .anatomical-door:focus-visible {
      outline: 1px solid rgba(217, 228, 255, .8);
      outline-offset: 2px;
    }

    #gallery {
      --door-x: 82%;
      --door-y: 59.2%;
      z-index: 2;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      color: var(--bone);
      background:
        radial-gradient(circle at 50% 44%, rgba(12, 62, 145, .42), transparent 28%),
        linear-gradient(153deg, #081630 0%, #020713 47%, #130912 100%);
      clip-path: circle(0 at var(--door-x) var(--door-y));
      transition:
        clip-path 1550ms cubic-bezier(.18, .82, .16, 1),
        opacity 300ms ease,
        visibility 0s linear 1550ms;
    }

    #gallery::before {
      content: "";
      position: absolute;
      inset: -6%;
      background:
        linear-gradient(rgba(2, 7, 19, .63), rgba(2, 7, 19, .86)),
        url("/assets/art/view-of-toledo-el-greco.jpg") center / cover no-repeat;
      filter: blur(8px) saturate(1.35) contrast(1.18);
      opacity: .38;
      transform: scale(1.08);
    }

    #gallery::after {
      content: "";
      position: absolute;
      z-index: 50;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0, 3, 11, .76), transparent 14%, transparent 86%, rgba(0, 3, 11, .76)),
        linear-gradient(rgba(0, 3, 11, .74), transparent 17%, transparent 78%, rgba(0, 3, 11, .9));
    }

    body.gallery-open #painting-view {
      opacity: 0;
      pointer-events: none;
      filter: blur(11px) saturate(1.7);
      transform: scale(1.58);
    }

    body.gallery-open #gallery {
      visibility: visible;
      opacity: 1;
      clip-path: circle(150% at var(--door-x) var(--door-y));
      transition:
        clip-path 1550ms cubic-bezier(.18, .82, .16, 1),
        opacity 300ms ease,
        visibility 0s;
    }

    #atmosphere {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .78;
    }

    .return {
      position: absolute;
      z-index: 80;
      top: max(14px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      width: 42px;
      height: 42px;
      border: 1px solid rgba(220, 196, 132, .25);
      border-radius: 50%;
      color: rgba(238, 226, 196, .72);
      background: rgba(2, 7, 18, .24);
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: color 180ms ease, border-color 180ms ease, transform 300ms ease;
    }

    .return:hover,
    .return:focus-visible {
      color: #fff;
      border-color: rgba(220, 196, 132, .72);
      outline: none;
      transform: rotate(-14deg);
    }

    .scene {
      position: absolute;
      z-index: 5;
      inset: 0;
      overflow: hidden;
      perspective: 1120px;
      perspective-origin: 50% 47%;
      cursor: grab;
      touch-action: none;
    }

    .scene.dragging {
      cursor: grabbing;
    }

    .world {
      --yaw: -2deg;
      --pitch: 1deg;
      --depth: 180px;
      --world-scale: 1;
      position: absolute;
      left: 50%;
      top: 48%;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      transform:
        translate3d(0, 0, var(--depth))
        rotateX(var(--pitch))
        rotateY(var(--yaw))
        scale(var(--world-scale));
      will-change: transform;
    }

    .floor {
      position: absolute;
      left: -1050px;
      top: 265px;
      width: 2100px;
      height: 3200px;
      transform-origin: 50% 0;
      transform: rotateX(90deg);
      pointer-events: none;
      background:
        radial-gradient(ellipse at 49% 5%, rgba(42, 105, 213, .28), transparent 19%),
        repeating-radial-gradient(ellipse at 49% 5%, transparent 0 105px, rgba(209, 177, 95, .12) 107px 108px),
        linear-gradient(90deg, transparent 49.9%, rgba(201, 170, 94, .13) 50%, transparent 50.1%),
        linear-gradient(#121421, #03060c 58%);
      box-shadow: inset 0 0 160px #000;
    }

    .floor::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(72deg, transparent 48%, rgba(123, 163, 219, .08) 49%, transparent 50%),
        linear-gradient(108deg, transparent 48%, rgba(123, 163, 219, .07) 49%, transparent 50%);
      background-size: 250px 250px;
      opacity: .65;
    }

    .ceiling {
      position: absolute;
      left: -1050px;
      top: -330px;
      width: 2100px;
      height: 3200px;
      transform-origin: 50% 0;
      transform: rotateX(-90deg);
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 7%, rgba(64, 116, 215, .25), transparent 23%),
        repeating-radial-gradient(ellipse at 50% 7%, transparent 0 150px, rgba(193, 164, 93, .08) 152px 153px),
        linear-gradient(#07162d, #02040b);
      opacity: .5;
    }

    .wall {
      position: absolute;
      top: -360px;
      width: 3000px;
      height: 720px;
      transform-origin: 0 50%;
      transform: rotateY(90deg);
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(3, 8, 19, .12), rgba(3, 8, 19, .82)),
        url("/assets/art/gubbio-studiolo.jpg") center / 900px auto repeat-x;
      background-blend-mode: multiply, normal;
      box-shadow: inset 0 0 180px rgba(0, 0, 0, .9);
      filter: saturate(.72) hue-rotate(168deg);
      opacity: .38;
    }

    .wall.left {
      left: -610px;
    }

    .wall.right {
      left: 610px;
      transform: rotateY(90deg) scaleY(-1);
      opacity: .31;
    }

    .apse {
      position: absolute;
      left: -640px;
      top: -360px;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      border-radius: 48% 48% 0 0 / 62% 62% 0 0;
      transform: translateZ(-2700px);
      pointer-events: none;
      background:
        linear-gradient(rgba(2, 9, 25, .15), rgba(2, 6, 16, .88)),
        url("/assets/art/view-of-toledo-el-greco.jpg") 47% 32% / cover no-repeat;
      box-shadow:
        inset 0 0 170px #02040b,
        0 0 120px rgba(12, 78, 184, .15);
      filter: saturate(.82) contrast(1.1);
      opacity: .56;
    }

    .arch {
      position: absolute;
      left: 0;
      top: 0;
      width: 1180px;
      height: 660px;
      border: 19px solid transparent;
      border-bottom: 0;
      border-radius: 50% 50% 0 0 / 56% 56% 0 0;
      transform: translate3d(-50%, -50%, var(--z));
      pointer-events: none;
      opacity: var(--presence, 1);
      background:
        linear-gradient(#15100b, #5c4223 42%, #21160d) padding-box,
        linear-gradient(90deg, #21160d, #b08a4a, #21160d) border-box;
      box-shadow:
        inset 0 0 0 2px rgba(223, 190, 105, .23),
        0 0 45px rgba(0, 0, 0, .72);
      transition: opacity 180ms linear;
    }

    .arch::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -18px;
      width: 7px;
      height: 112px;
      background: linear-gradient(#c9a965, transparent);
      box-shadow: 0 0 24px rgba(166, 195, 255, .2);
      opacity: .5;
    }

    .cosmos {
      position: absolute;
      left: 0;
      top: -8px;
      width: 530px;
      height: 530px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      overflow: visible;
      color: inherit;
      background: transparent;
      cursor: pointer;
      transform:
        translate3d(-50%, -50%, -2560px)
        rotateY(-4deg);
      transform-style: preserve-3d;
      opacity: var(--presence, 1);
      transition: opacity 180ms linear, filter 260ms ease;
    }

    .cosmos-disc {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 2px solid rgba(210, 176, 92, .65);
      border-radius: 50%;
      background: #071c3d;
      box-shadow:
        inset 0 0 40px #02050c,
        0 0 0 14px rgba(19, 68, 143, .16),
        0 0 0 15px rgba(207, 175, 91, .18),
        0 0 100px rgba(14, 88, 226, .28);
      transition: transform 700ms cubic-bezier(.18, .8, .2, 1), box-shadow 700ms ease;
    }

    .cosmos-disc img {
      position: absolute;
      left: -12.5%;
      top: -56.25%;
      width: 187.5%;
      height: auto;
      filter: saturate(.92) contrast(1.05);
      user-select: none;
      -webkit-user-drag: none;
    }

    .cosmos-rings {
      position: absolute;
      inset: -9%;
      border: 1px solid rgba(214, 181, 98, .23);
      border-radius: 50%;
      pointer-events: none;
      box-shadow:
        0 0 0 26px rgba(73, 119, 187, .04),
        0 0 0 58px rgba(73, 119, 187, .035),
        0 0 0 90px rgba(73, 119, 187, .025);
    }

    .cosmos:hover .cosmos-disc,
    .cosmos.selected .cosmos-disc {
      transform: rotate(7deg) scale(1.035);
      box-shadow:
        inset 0 0 38px #02050c,
        0 0 0 14px rgba(19, 68, 143, .2),
        0 0 0 15px rgba(226, 191, 103, .3),
        0 0 120px rgba(34, 111, 255, .46);
    }

    .cosmos:focus-visible {
      outline: 1px solid #d7c181;
      outline-offset: 18px;
    }

    .cabinet {
      --door-angle: -5deg;
      position: absolute;
      left: 0;
      top: 0;
      width: 242px;
      height: 294px;
      padding: 0;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      transform:
        translate3d(var(--x), var(--y), var(--z))
        rotateY(var(--ry))
        translate(-50%, -50%);
      transform-style: preserve-3d;
      opacity: var(--presence, 1);
      transition: opacity 180ms linear, filter 300ms ease;
      will-change: transform, opacity;
    }

    .cabinet-shell {
      position: absolute;
      inset: 0;
      overflow: visible;
      border: 10px solid #362515;
      background:
        linear-gradient(135deg, rgba(217, 176, 92, .22), transparent 28%),
        linear-gradient(160deg, #51381d, #130e0a 78%);
      box-shadow:
        inset 0 0 0 1px rgba(225, 191, 111, .4),
        0 18px 35px rgba(0, 0, 0, .65);
      transform-style: preserve-3d;
    }

    .cabinet-shell::before,
    .cabinet-shell::after {
      content: "";
      position: absolute;
      top: -24px;
      width: 18px;
      height: calc(100% + 48px);
      background: linear-gradient(90deg, #21150c, #8a6331 45%, #2c1c0f);
      box-shadow: inset 0 0 0 1px rgba(225, 193, 114, .22);
    }

    .cabinet-shell::before {
      left: -22px;
    }

    .cabinet-shell::after {
      right: -22px;
    }

    .recess {
      position: absolute;
      inset: 10px;
      overflow: hidden;
      border: 1px solid rgba(218, 183, 101, .4);
      background:
        radial-gradient(circle at 50% 40%, rgba(20, 76, 163, .32), transparent 38%),
        #040812;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, .85);
      transform: translateZ(-4px);
    }

    .cabinet-door {
      position: absolute;
      z-index: 4;
      inset: 10px;
      overflow: hidden;
      transform-origin: 0 50%;
      transform: translateZ(7px) rotateY(var(--door-angle));
      transform-style: preserve-3d;
      background:
        linear-gradient(rgba(76, 50, 25, .28), rgba(18, 12, 8, .68)),
        url("/assets/art/gubbio-studiolo.jpg") center / 500px auto;
      box-shadow:
        inset 0 0 0 1px rgba(229, 192, 104, .38),
        inset 0 0 35px rgba(0, 0, 0, .66),
        7px 8px 14px rgba(0, 0, 0, .42);
      transition: transform 760ms cubic-bezier(.18, .82, .16, 1);
      backface-visibility: visible;
    }

    .cabinet-door::before {
      content: "";
      position: absolute;
      inset: 15%;
      border: 4px double rgba(202, 161, 82, .52);
      background:
        repeating-linear-gradient(45deg, transparent 0 13px, rgba(210, 173, 94, .34) 14px 17px, transparent 18px 27px),
        repeating-linear-gradient(-45deg, transparent 0 13px, rgba(210, 173, 94, .25) 14px 17px, transparent 18px 27px),
        rgba(16, 12, 9, .35);
      box-shadow: inset 0 0 24px rgba(0, 0, 0, .72);
    }

    .cabinet-door::after {
      content: attr(data-mark);
      position: absolute;
      right: 13px;
      bottom: 11px;
      color: rgba(231, 207, 148, .65);
      font: 10px/1 "Berkeley Mono", ui-monospace, monospace;
      letter-spacing: .15em;
    }

    .cabinet.right .cabinet-door {
      --door-angle: 5deg;
      transform-origin: 100% 50%;
    }

    .cabinet:hover {
      filter: brightness(1.13);
    }

    .cabinet:hover .cabinet-door {
      --door-angle: -14deg;
    }

    .cabinet.right:hover .cabinet-door {
      --door-angle: 14deg;
    }

    .cabinet.selected {
      filter: drop-shadow(0 0 28px rgba(38, 108, 224, .42)) brightness(1.12);
    }

    .cabinet.selected .cabinet-door {
      --door-angle: -83deg;
    }

    .cabinet.right.selected .cabinet-door {
      --door-angle: 83deg;
    }

    .cabinet:focus-visible {
      outline: 1px solid rgba(235, 215, 160, .85);
      outline-offset: 9px;
    }

    .recess-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(.74) contrast(1.12);
    }

    .recess-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent 40%, rgba(1, 4, 11, .92));
    }

    .formula {
      position: absolute;
      right: 12px;
      bottom: 12px;
      left: 12px;
      color: rgba(241, 231, 201, .9);
      text-align: left;
      font: 10px/1.4 "Berkeley Mono", ui-monospace, monospace;
      letter-spacing: .04em;
    }

    .formula small {
      display: block;
      margin-bottom: 4px;
      color: rgba(207, 180, 111, .7);
      font-size: 8px;
      letter-spacing: .16em;
    }

    .fides-object {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 11px;
      height: 112px;
      background: linear-gradient(90deg, #755a2b, #f1d27f 48%, #60491f);
      box-shadow: 0 0 42px rgba(221, 186, 91, .38);
      transform: translate(-50%, -50%);
    }

    .fides-object::after {
      content: "";
      position: absolute;
      left: -34px;
      top: 29px;
      width: 79px;
      height: 10px;
      background: inherit;
    }

    .fides-orbit {
      position: absolute;
      left: 50%;
      top: 44%;
      width: 156px;
      height: 156px;
      border: 1px solid rgba(211, 183, 105, .36);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 0 27px rgba(39, 89, 175, .07),
        0 0 0 55px rgba(39, 89, 175, .04);
    }

    .language-sheet {
      position: absolute;
      inset: 13% 12% 26%;
      padding: 13px;
      color: #0a1830;
      text-align: left;
      font: 11px/2.4 "Berkeley Mono", ui-monospace, monospace;
      background:
        linear-gradient(90deg, rgba(7, 48, 101, .1) 1px, transparent 1px) 0 0 / 19px 19px,
        linear-gradient(rgba(7, 48, 101, .1) 1px, transparent 1px) 0 0 / 19px 19px,
        linear-gradient(145deg, #e8dfc7, #9eb9cf);
      box-shadow: 9px 12px 30px rgba(0, 0, 0, .36);
      transform: rotate(-3deg);
    }

    .language-sheet span {
      display: block;
      border-bottom: 1px solid rgba(6, 25, 55, .22);
    }

    .maker-chain {
      position: absolute;
      inset: 15% 13% 27%;
      display: grid;
      align-content: space-around;
      color: #c6daf8;
      text-align: left;
      font: 10px/1 "Berkeley Mono", ui-monospace, monospace;
      background:
        linear-gradient(127deg, transparent 48.8%, rgba(100, 167, 255, .75) 49.5% 50.2%, transparent 51%),
        repeating-linear-gradient(0deg, rgba(132, 176, 235, .09) 0 1px, transparent 1px 21px);
    }

    .maker-chain span:nth-child(2) {
      padding-left: 21%;
    }

    .maker-chain span:nth-child(3) {
      padding-left: 43%;
    }

    .maker-chain span:nth-child(4) {
      padding-left: 65%;
      color: #8abaff;
    }

    .eclipse {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 132px;
      height: 132px;
      border: 1px solid rgba(219, 189, 104, .34);
      border-radius: 50%;
      background: radial-gradient(circle, #ead17e 0 9%, #886f39 10%, #07070a 28%, #010102 61%);
      box-shadow: 0 0 50px rgba(214, 177, 81, .16);
      transform: translate(-50%, -50%);
    }

    .disc {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 142px;
      height: 25px;
      border-radius: 50%;
      background: linear-gradient(#d0e6ff, #315f98 36%, #02040a 73%);
      box-shadow:
        0 9px 37px rgba(101, 177, 255, .62),
        0 53px 65px rgba(61, 122, 255, .28);
      transform: translate(-50%, -50%) rotate(-7deg);
    }

    .books {
      position: absolute;
      inset: 18% 12% 28%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 6px;
    }

    .book {
      width: 16%;
      height: var(--book-h);
      border: 1px solid rgba(227, 200, 129, .36);
      background: var(--book-c);
      box-shadow: inset 4px 0 rgba(255, 255, 255, .07);
      transform: rotate(var(--book-r, 0deg));
      transform-origin: bottom;
    }

    .trajectory {
      position: absolute;
      inset: 12% 10% 25%;
      overflow: hidden;
      background:
        repeating-radial-gradient(circle at 27% 68%, transparent 0 28px, rgba(100, 157, 235, .15) 29px 30px),
        linear-gradient(67deg, transparent 48.5%, rgba(229, 208, 145, .8) 49% 49.6%, transparent 50.2%);
    }

    .trajectory::after {
      content: "→";
      position: absolute;
      left: 16%;
      top: 56%;
      color: #e6d7aa;
      font: 28px/1 "Berkeley Mono", ui-monospace, monospace;
      transform: rotate(-20deg);
    }

    .whisper {
      position: absolute;
      z-index: 70;
      left: 50%;
      bottom: max(25px, env(safe-area-inset-bottom));
      width: min(720px, calc(100vw - 110px));
      color: rgba(237, 228, 201, .86);
      text-align: center;
      font: 11px/1.5 "Berkeley Mono", ui-monospace, monospace;
      letter-spacing: .04em;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .whisper.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .whisper-label {
      color: rgba(207, 180, 112, .67);
      letter-spacing: .17em;
    }

    .whisper-formula {
      margin-left: 11px;
      color: #b8d4ff;
    }

    .instruction {
      position: absolute;
      z-index: 65;
      left: max(19px, env(safe-area-inset-left));
      bottom: max(20px, env(safe-area-inset-bottom));
      color: rgba(231, 221, 195, .3);
      font: 9px/1 "Berkeley Mono", ui-monospace, monospace;
      letter-spacing: .12em;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      .instruction {
        display: none;
      }

      .whisper {
        bottom: max(18px, env(safe-area-inset-bottom));
        width: calc(100vw - 80px);
        font-size: 9px;
      }

      .whisper-label {
        display: block;
        margin-bottom: 2px;
      }

      .whisper-formula {
        margin-left: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #painting-view,
      #gallery,
      .cabinet-door,
      .cosmos-disc,
      .whisper,
      .return {
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main id="painting-view">
    <div class="painting-stage">
      <img
        src="/assets/art/creation-giovanni-di-paolo.jpg"
        alt="The Creation of the World and the Expulsion from Paradise by Giovanni di Paolo, 1445"
        width="600"
        height="534"
        fetchpriority="high"
        decoding="async"
      >
      <button class="anatomical-door" id="anatomical-door" aria-label="Enter the private studiolo"></button>
    </div>
  </main>

  <section id="gallery" aria-hidden="true">
    <canvas id="atmosphere" aria-hidden="true"></canvas>
    <button class="return" id="return" aria-label="Return to the painting" tabindex="-1">↙</button>

    <div class="scene" id="scene" aria-label="An interactive impossible studiolo. Drag to look, scroll or swipe vertically to move through the room, and open its cabinets.">
      <div class="world" id="world">
        <div class="floor"></div>
        <div class="ceiling"></div>
        <div class="wall left"></div>
        <div class="wall right"></div>
        <div class="apse"></div>

        <div class="arch" data-z="-260" style="--z:-260px"></div>
        <div class="arch" data-z="-830" style="--z:-830px"></div>
        <div class="arch" data-z="-1400" style="--z:-1400px"></div>
        <div class="arch" data-z="-1970" style="--z:-1970px"></div>
        <div class="arch" data-z="-2540" style="--z:-2540px"></div>

        <button
          class="cabinet left"
          data-z="-420"
          data-label="I / ORIGIN"
          data-formula="x₀ = (39.5505°N, 107.3248°W)"
          data-copy="Place is the initial condition."
          style="--x:-465px;--y:-20px;--z:-420px;--ry:41deg"
          aria-label="Open origin cabinet"
          aria-pressed="false"
          tabindex="-1"
        >
          <span class="cabinet-shell">
            <span class="recess">
              <img class="recess-art" src="/assets/art/rocky-mountains-bierstadt.jpg" alt="" width="600" height="401" loading="lazy" decoding="async">
              <span class="recess-shade"></span>
              <span class="formula"><small>ORIGIN</small>39.5505 / −107.3248</span>
            </span>
            <span class="cabinet-door" data-mark="I"></span>
          </span>
        </button>

        <button
          class="cabinet right"
          data-z="-680"
          data-label="II / FIDES"
          data-formula="∀t, F(t) = 1"
          data-copy="The invariant."
          style="--x:470px;--y:-10px;--z:-680px;--ry:-43deg"
          aria-label="Open faith cabinet"
          aria-pressed="false"
          tabindex="-1"
        >
          <span class="cabinet-shell">
            <span class="recess">
              <span class="fides-orbit"></span>
              <span class="fides-object"></span>
              <span class="formula"><small>FIDES</small>∀t, F(t) = 1</span>
            </span>
            <span class="cabinet-door" data-mark="II"></span>
          </span>
        </button>

        <button
          class="cabinet left"
          data-z="-980"
          data-label="III / LINGUA"
          data-formula="Lₙ₊₁ = Lₙ + ε"
          data-copy="English. Spanish. Then the next."
          style="--x:-475px;--y:2px;--z:-980px;--ry:39deg"
          aria-label="Open language cabinet"
          aria-pressed="false"
          tabindex="-1"
        >
          <span class="cabinet-shell">
            <span class="recess">
              <span class="language-sheet">
                <span>hablar</span>
                <span>escuchar</span>
                <span>errar</span>
                <span>otra vez</span>
              </span>
              <span class="formula"><small>LINGUA</small>Lₙ₊₁ = Lₙ + ε</span>
            </span>
            <span class="cabinet-door" data-mark="III"></span>
          </span>
        </button>

        <button
          class="cabinet right"
          data-z="-1230"
          data-label="IV / OPUS"
          data-formula="idea → code → system → company"
          data-copy="The preferred tense is making."
          style="--x:462px;--y:-2px;--z:-1230px;--ry:-40deg"
          aria-label="Open builder cabinet"
          aria-pressed="false"
          tabindex="-1"
        >
          <span class="cabinet-shell">
            <span class="recess">
              <span class="maker-chain">
                <span>idea</span><span>code</span><span>system</span><span>company</span>
              </span>
              <span class="formula"><small>OPUS</small>Σ(build)ⁿ</span>
            </span>
            <span class="cabinet-door" data-mark="IV"></span>
          </span>
        </button>

        <button
          class="cabinet left"
          data-z="-1510"
          data-label="V / CINEMA"
          data-formula="24 fps · t ⇄ t⁻¹"
          data-copy="Raiders. Nolan. Practical wonder."
          style="--x:-468px;--y:4px;--z:-1510px;--ry:42deg"
          aria-label="Open cinema cabinet"
          aria-pressed="false"
          tabindex="-1"
        >
          <span class="cabinet-shell">
            <span class="recess">
              <span class="eclipse"></span>
              <span class="formula"><small>CINEMA</small>RAIDERS / NOLAN</span>
            </span>
            <span class="cabinet-door" data-mark="V"></span>
          </span>
        </button>

        <button
          class="cabinet right"
          data-z="-1770"
          data-label="VI / LIMEN"
          data-formula="P(NHI | public evidence) = ?"
          data-copy="The unknown remains genuinely unknown."
          style="--x:474px;--y:-4px;--z:-1770px;--ry:-41deg"
          aria-label="Open unknown cabinet"
          aria-pressed="false"
          tabindex="-1"
        >
          <span class="cabinet-shell">
            <span class="recess">
              <span class="disc"></span>
              <span class="formula"><small>LIMEN</small>P(NHI | E) = ?</span>
            </span>
            <span class="cabinet-door" data-mark="VI"></span>
          </span>
        </button>

        <button
          class="cabinet left"
          data-z="-2050"
          data-label="VII / ARCHIVE"
          data-formula="symbol → memory → self"
          data-copy="Books, poetry, names, compression."
          style="--x:-470px;--y:0;--z:-2050px;--ry:40deg"
          aria-label="Open archive cabinet"
          aria-pressed="false"
          tabindex="-1"
        >
          <span class="cabinet-shell">
            <span class="recess">
              <span class="books">
                <span class="book" style="--book-h:63%;--book-c:#173d73"></span>
                <span class="book" style="--book-h:81%;--book-c:#5d2835;--book-r:-3deg"></span>
                <span class="book" style="--book-h:70%;--book-c:#8b6d35"></span>
                <span class="book" style="--book-h:88%;--book-c:#214b42;--book-r:2deg"></span>
                <span class="book" style="--book-h:57%;--book-c:#2f315d"></span>
              </span>
              <span class="formula"><small>ARCHIVE</small>symbol → self</span>
            </span>
            <span class="cabinet-door" data-mark="VII"></span>
          </span>
        </button>

        <button
          class="cabinet right"
          data-z="-2290"
          data-label="VIII / KINETICS"
          data-formula="Eₖ = ½mv²"
          data-copy="Mechanism. Precision. Consequence."
          style="--x:468px;--y:2px;--z:-2290px;--ry:-42deg"
          aria-label="Open kinetics cabinet"
          aria-pressed="false"
          tabindex="-1"
        >
          <span class="cabinet-shell">
            <span class="recess">
              <span class="trajectory"></span>
              <span class="formula"><small>KINETICS</small>Eₖ = ½mv²</span>
            </span>
            <span class="cabinet-door" data-mark="VIII"></span>
          </span>
        </button>

        <button
          class="cosmos"
          id="cosmos"
          data-z="-2560"
          data-label="IX / P.W.Y."
          data-formula="lim(question → ∞) Patrick = alive"
          data-copy="faith + work + wonder + place"
          aria-label="Open the innermost cosmology"
          aria-pressed="false"
          tabindex="-1"
        >
          <span class="cosmos-rings"></span>
          <span class="cosmos-disc">
            <img src="/assets/art/creation-giovanni-di-paolo.jpg" alt="" width="600" height="534" loading="lazy" decoding="async">
          </span>
        </button>
      </div>
    </div>

    <div class="whisper" id="whisper" aria-live="polite">
      <span class="whisper-label" id="whisper-label"></span>
      <span class="whisper-formula" id="whisper-formula"></span>
    </div>
    <div class="instruction">drag · wheel · open · esc</div>
  </section>

  <script>
    (() => {
      const body = document.body;
      const painting = document.getElementById("painting-view");
      const door = document.getElementById("anatomical-door");
      const gallery = document.getElementById("gallery");
      const returnButton = document.getElementById("return");
      const scene = document.getElementById("scene");
      const world = document.getElementById("world");
      const cabinets = [...document.querySelectorAll(".cabinet")];
      const arches = [...document.querySelectorAll(".arch")];
      const cosmos = document.getElementById("cosmos");
      const selectable = [...cabinets, cosmos];
      const whisper = document.getElementById("whisper");
      const whisperLabel = document.getElementById("whisper-label");
      const whisperFormula = document.getElementById("whisper-formula");
      const canvas = document.getElementById("atmosphere");
      const context = canvas.getContext("2d", { alpha: true });
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      let open = false;
      let dragging = false;
      let moved = false;
      let startX = 0;
      let startY = 0;
      let lastX = 0;
      let lastY = 0;
      let pointerType = "mouse";
      let yaw = -2;
      let pitch = 1;
      let depth = 180;
      let lookX = 0;
      let lookY = 0;
      let frame = 0;
      let motes = [];

      function clamp(value, minimum, maximum) {
        return Math.max(minimum, Math.min(maximum, value));
      }

      function setGalleryFocus(enabled) {
        returnButton.tabIndex = enabled ? 0 : -1;
        selectable.forEach((item) => {
          item.tabIndex = enabled ? 0 : -1;
        });
      }

      function resize() {
        const ratio = Math.min(devicePixelRatio || 1, 1.5);
        canvas.width = Math.round(innerWidth * ratio);
        canvas.height = Math.round(innerHeight * ratio);
        canvas.style.width = `${innerWidth}px`;
        canvas.style.height = `${innerHeight}px`;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        const scale = Math.max(.58, Math.min(1, innerWidth / 1180, innerHeight / 760));
        world.style.setProperty("--world-scale", scale.toFixed(3));
        motes = Array.from({ length: Math.min(72, Math.round(innerWidth / 18)) }, (_, index) => ({
          x: Math.random() * innerWidth,
          y: Math.random() * innerHeight,
          z: Math.random(),
          r: index % 11 === 0 ? 1.45 : .45 + Math.random() * .65,
          a: .07 + Math.random() * .28
        }));
      }

      function presenceFor(z) {
        const position = z + depth;
        if (position > 460) return clamp(1 - (position - 460) / 260, 0, 1);
        if (position < -2450) return clamp(1 - (-2450 - position) / 500, .08, 1);
        return 1;
      }

      function drawAtmosphere(time) {
        context.clearRect(0, 0, innerWidth, innerHeight);
        const gradient = context.createRadialGradient(
          innerWidth * (.5 + lookX * .05),
          innerHeight * (.44 + lookY * .03),
          0,
          innerWidth * .5,
          innerHeight * .48,
          innerWidth * .58
        );
        gradient.addColorStop(0, "rgba(29, 87, 184, .08)");
        gradient.addColorStop(.55, "rgba(18, 43, 93, .025)");
        gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
        context.fillStyle = gradient;
        context.fillRect(0, 0, innerWidth, innerHeight);

        for (const mote of motes) {
          const drift = reducedMotion ? 0 : time * (.00012 + mote.z * .00018);
          const x = (mote.x + Math.sin(drift * 7 + mote.y) * 14 + lookX * 22 * mote.z + innerWidth) % innerWidth;
          const y = (mote.y - drift * 12 + innerHeight) % innerHeight;
          context.beginPath();
          context.fillStyle = `rgba(181, 205, 242, ${mote.a})`;
          context.arc(x, y, mote.r, 0, Math.PI * 2);
          context.fill();
        }
      }

      function render(time = 0) {
        if (!open) return;
        const breath = reducedMotion ? 0 : Math.sin(time * .0002) * .55;
        world.style.setProperty("--yaw", `${yaw + lookX * 2.5 + breath}deg`);
        world.style.setProperty("--pitch", `${pitch - lookY * 1.7}deg`);
        world.style.setProperty("--depth", `${depth}px`);

        cabinets.forEach((cabinet) => {
          cabinet.style.setProperty("--presence", presenceFor(Number(cabinet.dataset.z)).toFixed(3));
          cabinet.style.pointerEvents = presenceFor(Number(cabinet.dataset.z)) < .13 ? "none" : "auto";
        });
        arches.forEach((arch) => {
          arch.style.setProperty("--presence", presenceFor(Number(arch.dataset.z)).toFixed(3));
        });
        cosmos.style.setProperty("--presence", presenceFor(Number(cosmos.dataset.z)).toFixed(3));
        drawAtmosphere(time);
        if (!reducedMotion) frame = requestAnimationFrame(render);
      }

      function requestRender() {
        if (open && reducedMotion) render(performance.now());
      }

      function enterGallery() {
        if (open) return;
        const threshold = door.getBoundingClientRect();
        gallery.style.setProperty("--door-x", `${threshold.left + threshold.width / 2}px`);
        gallery.style.setProperty("--door-y", `${threshold.top + threshold.height / 2}px`);
        open = true;
        body.classList.add("gallery-open");
        painting.setAttribute("aria-hidden", "true");
        gallery.setAttribute("aria-hidden", "false");
        setGalleryFocus(true);
        resize();
        cancelAnimationFrame(frame);
        frame = requestAnimationFrame(render);
        setTimeout(() => returnButton.focus({ preventScroll: true }), reducedMotion ? 0 : 950);
      }

      function leaveGallery() {
        if (!open) return;
        open = false;
        clearSelection();
        body.classList.remove("gallery-open");
        painting.setAttribute("aria-hidden", "false");
        gallery.setAttribute("aria-hidden", "true");
        setGalleryFocus(false);
        cancelAnimationFrame(frame);
        setTimeout(() => door.focus({ preventScroll: true }), reducedMotion ? 0 : 750);
      }

      function clearSelection() {
        selectable.forEach((item) => {
          item.classList.remove("selected");
          item.setAttribute("aria-pressed", "false");
        });
        whisper.classList.remove("visible");
      }

      function select(item) {
        const alreadySelected = item.classList.contains("selected");
        clearSelection();
        if (alreadySelected) return;
        item.classList.add("selected");
        item.setAttribute("aria-pressed", "true");
        whisperLabel.textContent = item.dataset.label;
        whisperFormula.textContent = item.dataset.formula;
        whisper.classList.add("visible");
      }

      door.addEventListener("click", enterGallery);
      returnButton.addEventListener("click", leaveGallery);

      selectable.forEach((item) => {
        item.addEventListener("click", (event) => {
          event.stopPropagation();
          if (!moved) select(item);
        });
      });

      scene.addEventListener("pointerdown", (event) => {
        moved = false;
        if (event.target.closest(".cabinet, .cosmos, .return")) return;
        dragging = true;
        pointerType = event.pointerType;
        startX = lastX = event.clientX;
        startY = lastY = event.clientY;
        scene.setPointerCapture(event.pointerId);
        scene.classList.add("dragging");
      });

      scene.addEventListener("pointermove", (event) => {
        lookX = event.clientX / innerWidth - .5;
        lookY = event.clientY / innerHeight - .5;
        if (!dragging) return;
        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;
        yaw = clamp(yaw + dx * .08, -24, 24);
        if (pointerType === "touch") {
          depth = clamp(depth - dy * 2.1, 80, 1760);
        } else {
          pitch = clamp(pitch - dy * .06, -9, 9);
        }
        lastX = event.clientX;
        lastY = event.clientY;
        if (Math.hypot(event.clientX - startX, event.clientY - startY) > 4) moved = true;
        requestRender();
      });

      function releasePointer(event) {
        if (!dragging) return;
        dragging = false;
        scene.classList.remove("dragging");
        if (scene.hasPointerCapture(event.pointerId)) scene.releasePointerCapture(event.pointerId);
      }

      scene.addEventListener("pointerup", releasePointer);
      scene.addEventListener("pointercancel", releasePointer);

      scene.addEventListener("wheel", (event) => {
        event.preventDefault();
        depth = clamp(depth + event.deltaY * .58, 80, 1760);
        requestRender();
      }, { passive: false });

      scene.addEventListener("click", (event) => {
        if (!event.target.closest(".cabinet, .cosmos") && !moved) clearSelection();
      });

      scene.addEventListener("dblclick", () => {
        yaw = -2;
        pitch = 1;
        depth = 180;
        clearSelection();
        requestRender();
      });

      addEventListener("keydown", (event) => {
        if (!open) return;
        if (event.key === "Escape") {
          if (whisper.classList.contains("visible")) clearSelection();
          else leaveGallery();
        } else if (event.key === "ArrowLeft") {
          yaw = clamp(yaw - 4, -24, 24);
        } else if (event.key === "ArrowRight") {
          yaw = clamp(yaw + 4, -24, 24);
        } else if (event.key === "ArrowUp") {
          depth = clamp(depth - 85, 80, 1760);
        } else if (event.key === "ArrowDown") {
          depth = clamp(depth + 85, 80, 1760);
        } else {
          return;
        }
        event.preventDefault();
        requestRender();
      });

      addEventListener("resize", () => {
        resize();
        requestRender();
      }, { passive: true });

      setGalleryFocus(false);
    })();
  </script>
</body>
</html>
